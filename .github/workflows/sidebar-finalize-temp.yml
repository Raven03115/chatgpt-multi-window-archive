name: Temporary Sidebar Compatibility Finalizer

on:
  push:
    branches:
      - fix/chatgpt-sidebar-2026-09-27

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: fix/chatgpt-sidebar-2026-09-27
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply verified candidate patch
        run: node scripts/finalize-sidebar-compat-temp.cjs

      - name: Syntax checks
        run: |
          node --check poc-shaped-sidebar-v4.5.4.js
          node --check sidebar-shape-preload-v4.5.4.js
          node --check lib/route-policy.cjs
          node --check tests/route-policy.test.cjs
          node --check lib/sidebar-geometry.cjs
          node --check tests/sidebar-geometry.test.cjs
          node --check tests/sidebar-width-integration.test.cjs

      - name: Prepare Electron sandbox
        run: |
          node -e "require('electron')"
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      - name: Full repository verification
        run: xvfb-run -a npm run verify

      - name: Diff validation
        run: git diff --check

      - name: Remove temporary finalizer files
        run: |
          rm scripts/finalize-sidebar-compat-temp.cjs
          rm .github/workflows/sidebar-finalize-temp.yml

      - name: Commit verified candidate
        run: |
          git config user.name "Raven"
          git config user.email "70535765+Raven03115@users.noreply.github.com"
          git add -A
          git commit -m "fix: restore compatibility with updated ChatGPT sidebar"
          git push origin HEAD:fix/chatgpt-sidebar-2026-09-27
